<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Wedding Invitation ｜ 電子喜帖</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400&family=Klee+One:wght@400;600&family=Kaisei+Decol:wght@400&display=swap');

  :root{
    --silver-1:#f5f6f7;
    --silver-2:#e4e7e9;
    --silver-shine:#ffffff;
    --tiffany-pale:#eaf8f6;
    --tiffany-soft:#bfeae4;
    --tiffany-mid:#7fd1c7;
    --tiffany-deep:#1f6e68;
    --tiffany-deep-2:#154e4a;
    --deep-sea:#5a94ad;
    --deep-sea-2:#3f7089;
    --ink:#33403f;
    --ink-soft:#6b7876;
    --paper:#fdfefe;
    --shadow: 0 20px 60px rgba(31,110,104,0.12);
    --sky-blue:#dcf0f7;
    --sky-blue-deep:#aed9ea;
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    font-family:'Noto Sans TC','Cormorant Garamond',serif;
    color:var(--ink);
    background:linear-gradient(160deg, #eef8fb 0%, #d8eef6 45%, var(--sky-blue-deep) 100%);
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed; inset:-10%;
    z-index:-1;
    background:
      radial-gradient(circle at 18% 15%, rgba(255,255,255,0.7), transparent 42%),
      radial-gradient(circle at 78% 20%, rgba(255,255,255,0.5), transparent 38%),
      radial-gradient(circle at 65% 75%, rgba(255,255,255,0.45), transparent 45%),
      radial-gradient(circle at 12% 82%, rgba(255,255,255,0.4), transparent 40%),
      radial-gradient(circle 3px at 12% 22%, rgba(255,255,255,0.9), transparent 60%),
      radial-gradient(circle 2px at 28% 40%, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(circle 4px at 45% 15%, rgba(255,255,255,0.85), transparent 60%),
      radial-gradient(circle 2px at 60% 55%, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(circle 3px at 75% 30%, rgba(255,255,255,0.9), transparent 60%),
      radial-gradient(circle 2px at 85% 65%, rgba(255,255,255,0.75), transparent 60%),
      radial-gradient(circle 3px at 20% 75%, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(circle 2px at 55% 82%, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(circle 4px at 90% 88%, rgba(255,255,255,0.85), transparent 60%),
      radial-gradient(circle 2px at 35% 92%, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(circle 2px at 68% 10%, rgba(255,255,255,0.75), transparent 60%),
      radial-gradient(circle 3px at 8% 55%, rgba(255,255,255,0.8), transparent 60%);
    animation:twinkle 4.5s ease-in-out infinite alternate;
    pointer-events:none;
  }

  h1,h2,h3{ font-weight:400; margin:0; }

  .script{ font-family:'Parisienne', cursive; }
  .serif-tc{ font-family:'Noto Serif TC', serif; font-weight:300; }
  .cute-tc{ font-family:'Klee One','Noto Sans TC', sans-serif; }

  button{ font-family:inherit; cursor:pointer; }

  /* ===================== ENVELOPE SCREEN ===================== */
  #envelope-screen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 18% 15%, rgba(255,255,255,0.85), transparent 42%),
      radial-gradient(circle at 78% 20%, rgba(255,255,255,0.6), transparent 38%),
      radial-gradient(circle at 65% 75%, rgba(255,255,255,0.55), transparent 45%),
      radial-gradient(circle at 12% 82%, rgba(255,255,255,0.5), transparent 40%),
      linear-gradient(160deg, #eef8fb 0%, #d8eef6 45%, var(--sky-blue-deep) 100%);
    z-index:100;
    overflow:hidden;
    transition:opacity 1s ease, visibility 1s ease;
  }
  #envelope-screen::before{
    content:'';
    position:absolute; inset:-10%;
    background:
      radial-gradient(circle 3px at 12% 22%, rgba(255,255,255,0.9), transparent 60%),
      radial-gradient(circle 2px at 28% 40%, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(circle 4px at 45% 15%, rgba(255,255,255,0.85), transparent 60%),
      radial-gradient(circle 2px at 60% 55%, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(circle 3px at 75% 30%, rgba(255,255,255,0.9), transparent 60%),
      radial-gradient(circle 2px at 85% 65%, rgba(255,255,255,0.75), transparent 60%),
      radial-gradient(circle 3px at 20% 75%, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(circle 2px at 55% 82%, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(circle 4px at 90% 88%, rgba(255,255,255,0.85), transparent 60%),
      radial-gradient(circle 2px at 35% 92%, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(circle 2px at 68% 10%, rgba(255,255,255,0.75), transparent 60%),
      radial-gradient(circle 3px at 8% 55%, rgba(255,255,255,0.8), transparent 60%);
    animation:twinkle 4.5s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes twinkle{
    0%{ opacity:.45; }
    50%{ opacity:1; }
    100%{ opacity:.55; }
  }
  #envelope-screen.hidden .envelope-stage{
    filter:blur(80px);
    opacity:0;
    transition:filter .6s ease, opacity .6s ease;
  }
  #envelope-screen.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .6s ease, visibility .6s ease;
  }

  .envelope-stage{
    position:relative;
    z-index:1;
    perspective:1600px;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    animation:stageIn 1.4s ease forwards;
    transition:transform 1.1s cubic-bezier(.4,0,.2,1), filter 1.1s ease, opacity 1.1s ease;
  }
  @keyframes stageIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .envelope{
    position:relative;
    width:clamp(320px, 92vw, 620px);
    height:clamp(220px, 63vw, 420px);
    transition:transform 1s cubic-bezier(.4,0,.2,1), filter 1s ease;
    filter:blur(0px);
  }
  .envelope.open{
    transform:scale(1.6);
    filter:blur(6px);
  }

  .envelope-body{
    position:absolute; inset:0;
    background:
      linear-gradient(100deg, transparent 28%, rgba(255,255,255,0.65) 42%, transparent 56%),
      linear-gradient(155deg, var(--silver-shine) 0%, var(--silver-1) 38%, var(--silver-2) 62%, var(--silver-shine) 84%, var(--silver-2) 100%);
    border-radius:8px;
    box-shadow:
      var(--shadow),
      inset 0 1px 0 rgba(255,255,255,0.9);
    overflow:hidden;
  }
  /* 信封內側露出的三角形：封蓋翻開時才看得到 */
  .envelope-inside{
    position:absolute; inset:0;
    clip-path:polygon(0 0, 100% 0, 50% 48%);
    background:linear-gradient(180deg, #bfe6ea 0%, #d3eef0 60%, #e2f4f5 100%);
  }
  /* 壓紋波浪：白色線條加一道灰色下陰影，做出浮雕感 */
  .envelope-waves{
    position:absolute; inset:0;
    width:100%; height:100%;
    filter:drop-shadow(0 1.4px 0 rgba(120,138,150,0.42));
    pointer-events:none;
  }
  .envelope-waves path{
    fill:none;
    stroke:rgba(255,255,255,0.96);
    stroke-width:1.7px;
    stroke-linecap:round;
    stroke-linejoin:round;
    vector-effect:non-scaling-stroke;
  }

  .envelope-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:62%;
    transform-origin:top center;
    transform-style:preserve-3d;
    transform:perspective(1400px) rotateX(calc(var(--p, 0) * 180deg));
    transition:transform 1s cubic-bezier(.65,0,.35,1);
    z-index:3;
    /* 注意：這裡不能加 filter，否則會把 3D 壓平，正反面就無法分開顯示 */
  }
  .envelope.dragging .envelope-flap{ transition:none; }
  .flap-face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    filter:drop-shadow(0 2px 10px rgba(31,110,104,0.1));
  }
  .flap-face svg{ display:block; width:100%; height:100%; overflow:visible; }
  .flap-back{ transform:rotateX(180deg); }

  .envelope-text{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    z-index:6;
    text-align:center;
    pointer-events:none;
    opacity:calc(1 - var(--p, 0) * 2.4);
    transition:opacity .6s ease;
  }
  .envelope.dragging .envelope-text{ transition:none; }
  .envelope-text .script{
    font-size:clamp(26px, 6vw, 38px);
    color:var(--tiffany-deep-2);
    display:block;
    animation:breathe 3.2s ease-in-out infinite;
  }
  .envelope-text .tap-hint{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    margin-top:8px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:13px;
    letter-spacing:3px;
    color:var(--ink-soft);
  }
  .swipe-chevron{
    width:16px; height:16px;
    fill:none;
    stroke:var(--deep-sea);
    stroke-width:1.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    animation:nudgeUp 1.8s ease-in-out infinite;
  }
  @keyframes nudgeUp{
    0%,100%{ transform:translateY(2px); opacity:.5; }
    50%{ transform:translateY(-3px); opacity:1; }
  }
  #envelope-screen{ touch-action:none; cursor:grab; }
  #envelope-screen.grabbing{ cursor:grabbing; }
  @keyframes breathe{
    0%,100%{ transform:scale(1); opacity:.82; }
    50%{ transform:scale(1.045); opacity:1; }
  }

  /* ===================== 開啟後的海浪、柔焦光斑、玻璃泡泡與愛心 ===================== */
  .burst-layer{
    position:absolute; inset:0;
    pointer-events:none;
    overflow:hidden;
  }
  .burst-bokeh{ z-index:0; }
  .burst-sea{ z-index:2; }
  .burst-bubbles{ z-index:3; }
  /* 柔焦光斑：邊緣模糊的藍白圓點，慢慢往上漂 */
  .bokeh{
    position:absolute;
    left:var(--left, 50%); top:var(--top, 50%);
    width:var(--size, 80px); height:var(--size, 80px);
    margin:calc(var(--size, 80px) / -2) 0 0 calc(var(--size, 80px) / -2);
    border-radius:50%;
    background:radial-gradient(circle, var(--bk-color, rgba(255,255,255,.85)) 0%, transparent 68%);
    filter:blur(10px);
    opacity:0;
  }
  #envelope-screen.burst .bokeh{
    animation:bokehDrift 1.7s ease-out forwards;
    animation-delay:var(--delay, 0s);
  }
  @keyframes bokehDrift{
    0%{ opacity:0; transform:translateY(24px) scale(.8); }
    35%{ opacity:var(--bk-peak, .55); }
    100%{ opacity:0; transform:translateY(-60px) scale(1.15); }
  }
  /* 海浪：三層，從畫面底部湧上，浪頂有白色浪花線，最前層帶水沫 */
  .sea-wave{
    position:absolute;
    left:0; bottom:0;
    width:200%; height:52%;
    transform:translateY(105%);
    opacity:0;
  }
  .sea-wave svg{ display:block; width:100%; height:100%; will-change:transform; }
  .sea-wave .fill{ stroke:none; }
  /* 柔化：整層輕微模糊，越靠後越糊，浪線不再有硬邊 */
  .sea-back svg{ filter:blur(4px); }
  .sea-mid svg{ filter:blur(2.8px); }
  .sea-front svg{ filter:blur(1.8px); }
  .sea-wave .crest{ fill:none; stroke:rgba(255,255,255,.7); stroke-width:3; stroke-linecap:round; vector-effect:non-scaling-stroke; }
  .sea-wave .crest2{ fill:none; stroke:rgba(255,255,255,.3); stroke-width:2; vector-effect:non-scaling-stroke; }
  /* 浪花：沿著浪頂畫一條「點狀線」，用 non-scaling-stroke 讓小點不會被拉成橢圓 */
  .sea-wave .foam{
    fill:none; stroke:#fff; stroke-width:3.4; stroke-linecap:round;
    stroke-dasharray:.1 13;
    vector-effect:non-scaling-stroke;
    opacity:.7;
  }
  .sea-back{ --rise:-7%; --rise-end:-14%; --dur-x:11s; }
  .sea-mid{ --rise:-3%; --rise-end:-9%; --dur-x:8s; }
  .sea-front{ --rise:0%; --rise-end:-4%; --dur-x:6s; }
  #envelope-screen.burst .sea-wave{
    will-change:transform, opacity;
    animation:seaRise 1.4s cubic-bezier(.25,.6,.3,1) forwards;
    animation-delay:var(--delay, 0s);
  }
  /* 左右流動改在內層 svg 上用 transform（走 GPU），不再用 margin-left（會一直重排造成卡頓） */
  #envelope-screen.burst .sea-wave svg{
    animation:seaSway var(--dur-x) linear infinite;
  }
  .sea-back{ --delay:0s; }
  .sea-mid{ --delay:.1s; }
  .sea-front{ --delay:.2s; }
  @keyframes seaRise{
    0%{ opacity:0; transform:translate3d(0,105%,0); }
    15%{ opacity:1; }
    70%{ opacity:1; transform:translate3d(0,var(--rise),0); }
    100%{ opacity:1; transform:translate3d(0,var(--rise-end),0); }
  }
  @keyframes seaSway{
    from{ transform:translate3d(0,0,0); }
    to{ transform:translate3d(-50%,0,0); }
  }
  /* 玻璃泡泡：邊緣高光加一小塊反光，上升時左右搖擺，到頂端「啵」地放大再消失 */
  .bubble{
    position:absolute;
    bottom:var(--start, 6%);
    left:var(--left, 50%);
    width:var(--size, 16px); height:var(--size, 16px);
    border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 9%, transparent 11%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.10) 55%, rgba(255,255,255,.32) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.85),
      inset 0 -3px 5px rgba(143,198,218,.35),
      0 0 6px rgba(255,255,255,.45);
    opacity:0;
  }
  #envelope-screen.burst .bubble{
    /* 每個關鍵影格之間各自套用緩動會一段一段頓挫，所以用等速 */
    animation:bubbleRise var(--dur, 1.4s) linear forwards;
    animation-delay:var(--delay, 0s);
  }
  /* 破掉的瞬間：四面八方散出小水珠 */
  .bubble::after{
    content:''; position:absolute; inset:0; border-radius:50%;
    opacity:0;
    box-shadow:
      0 calc(var(--size, 16px) * -.62) 0 calc(var(--size, 16px) * -.45) #fff,
      0 calc(var(--size, 16px) * .62) 0 calc(var(--size, 16px) * -.45) #fff,
      calc(var(--size, 16px) * -.62) 0 0 calc(var(--size, 16px) * -.45) #fff,
      calc(var(--size, 16px) * .62) 0 0 calc(var(--size, 16px) * -.45) #fff,
      calc(var(--size, 16px) * -.44) calc(var(--size, 16px) * -.44) 0 calc(var(--size, 16px) * -.45) #fff,
      calc(var(--size, 16px) * .44) calc(var(--size, 16px) * -.44) 0 calc(var(--size, 16px) * -.45) #fff,
      calc(var(--size, 16px) * -.44) calc(var(--size, 16px) * .44) 0 calc(var(--size, 16px) * -.45) #fff,
      calc(var(--size, 16px) * .44) calc(var(--size, 16px) * .44) 0 calc(var(--size, 16px) * -.45) #fff;
  }
  #envelope-screen.burst .bubble::after{
    animation:popDrops var(--dur, 1.4s) linear forwards;
    animation-delay:var(--delay, 0s);
  }
  @keyframes popDrops{
    0%,84%{ opacity:0; }
    90%{ opacity:1; }
    100%{ opacity:0; }
  }
  @keyframes bubbleRise{
    0%{ opacity:0; transform:translate(0,0) scale(.6); }
    14%{ opacity:1; transform:translate(0,calc(var(--rise-y) * -.12)) scale(1); }
    34%{ transform:translate(var(--sway), calc(var(--rise-y) * -.38)) scale(1); }
    56%{ transform:translate(calc(var(--sway) * -.7), calc(var(--rise-y) * -.64)) scale(1); }
    80%{ opacity:1; transform:translate(calc(var(--sway) * .5), calc(var(--rise-y) * -.9)) scale(1.02); }
    90%{ opacity:.9; transform:translate(calc(var(--sway) * .5), calc(var(--rise-y) * -.96)) scale(1.35); }
    100%{ opacity:0; transform:translate(calc(var(--sway) * .5), calc(var(--rise-y) * -1)) scale(1.9); }
  }
  /* 堆疊愛心：和泡泡一起升起，三層疊出透視感 */
  .floating-heart{
    position:absolute;
    bottom:var(--start, 6%);
    left:var(--left, 50%);
    width:var(--size, 30px); height:var(--size, 30px);
    color:#86c3da;
    opacity:0; overflow:visible;
  }
  .floating-heart .layer{ transform-box:fill-box; transform-origin:center; fill:currentColor; }
  .floating-heart .layer1{ opacity:1; transform:scale(0.8); }
  .floating-heart .layer2{ opacity:.45; transform:scale(1.15); }
  .floating-heart .layer3{ opacity:.2; transform:scale(1.55); }
  #envelope-screen.burst .floating-heart{
    animation:heartRise var(--dur, 1.35s) linear forwards;
    animation-delay:var(--delay, 0s);
  }
  @keyframes heartRise{
    0%{ opacity:0; transform:translate(0,0) scale(.8); }
    18%{ opacity:1; }
    45%{ transform:translate(var(--sway), calc(var(--rise-y) * -.5)) scale(1); }
    100%{ opacity:0; transform:translate(calc(var(--sway) * -.6), calc(var(--rise-y) * -1)) scale(1.12); }
  }

  /* ===================== MUSIC TOGGLE ===================== */
  #music-toggle{
    position:fixed;
    top:20px; right:20px;
    width:42px; height:42px;
    border-radius:50%;
    border:1px solid rgba(31,110,104,0.25);
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    z-index:200;
    transition:background .3s ease;
  }
  #music-toggle:hover{ background:rgba(255,255,255,0.95); }
  #music-toggle svg{ width:20px; height:20px; stroke:var(--tiffany-deep-2); }
  .mute-slash{ display:none; }
  #music-toggle.muted .mute-slash{ display:block; }
  #music-toggle.muted .wave{ opacity:.25; }

  /* ===================== MAIN CONTENT ===================== */
  #main-content{
    opacity:0;
    transition:opacity 1.2s ease;
  }
  #main-content.visible{ opacity:1; }

  section{
    max-width:720px;
    margin:0 auto;
    padding:48px 24px;
    position:relative;
  }

  .reveal{
    opacity:0;
    transform:translateY(28px);
    transition:opacity .9s ease, transform .9s ease;
  }
  .reveal.in-view{
    opacity:1;
    transform:translateY(0);
  }
  #hero .reveal:nth-child(1){ transition-delay:.05s; }
  #hero .reveal:nth-child(2){ transition-delay:.2s; }
  #hero .reveal:nth-child(3){ transition-delay:.35s; }
  #hero .reveal:nth-child(4){ transition-delay:.5s; }

  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:700;
    font-size:15px;
    letter-spacing:4px;
    color:var(--deep-sea);
    text-transform:uppercase;
    text-align:center;
    margin-bottom:14px;
  }

  .eyebrow.cute-tc{
    font-family:'Klee One','Noto Sans TC', sans-serif;
    font-style:normal;
  }

  /* --- HERO / PHOTO --- */
  #hero{ text-align:center; padding-top:64px; }

  .couple-names{
    font-family:'Kaisei Decol','Klee One','Noto Sans TC',serif;
    font-size:clamp(36px, 9vw, 56px);
    font-weight:400;
    letter-spacing:.12em;
    color:var(--ink);
  }
  .couple-names .amp{
    color:var(--deep-sea);
    font-family:'Parisienne',cursive;
    font-weight:400;
    font-size:1.15em;
    letter-spacing:0;
    margin:0 .3em;
    position:relative; top:.04em;
  }

  :root{ --PW:min(86vw,360px); }
  /* ===== 信封 + 照片場景 ===== */
  .photo-scene{position:relative;width:var(--PW);height:calc(var(--PW) * 1.36);margin:0 auto;perspective:1200px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .ps-env{position:absolute;left:0;bottom:0;width:100%;height:calc(var(--PW) * .62);opacity:0;transform:translateY(24px)}
  .ps-back{position:absolute;inset:0;border-radius:3px;z-index:0;
   background:linear-gradient(160deg,#e9f5f8 0%,#c9e4ec 60%,#bcdbe5 100%);box-shadow:0 14px 30px rgba(63,112,137,.22)}
  .ps-pocket{position:absolute;inset:0;z-index:3;
   clip-path:polygon(0 100%,100% 100%,100% 38%,50% 62%,0 38%);
   background:linear-gradient(120deg,#fbfefe 0%,#e8f4f7 45%,#f6fbfc 70%,#dcedf2 100%);
   filter:drop-shadow(0 -2px 3px rgba(63,112,137,.18))}
  .ps-pocket::after{content:'';position:absolute;inset:0;
   background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 46%,transparent 60%);}
  .ps-clip{position:absolute;left:-20%;right:-20%;bottom:0;top:calc(var(--PW) * -1.1);overflow:hidden;z-index:2;pointer-events:none}
  .ps-wrap{position:absolute;left:50%;bottom:calc(var(--PW) * .06);width:calc(var(--PW) * .78);margin-left:calc(var(--PW) * -.39);
   transform-origin:50% 100%;transform:translateY(calc(var(--PW) * .9))}
  .ps-ph{position:relative;width:100%;aspect-ratio:960/1331}
  .ps-ph img{display:block;width:100%;height:100%;object-fit:cover}
  /* 柔邊層：疊在硬邊照片上，慢慢浮現；硬邊層稍後再淡出，邊緣就會慢慢霧化而不是一次切換 */
  .ps-soft{position:absolute;inset:0;--psf:1;opacity:0;
   -webkit-mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.12) calc(4% * var(--psf)),rgba(0,0,0,.45) calc(9% * var(--psf)),rgba(0,0,0,.8) calc(15% * var(--psf)),#000 calc(22% * var(--psf)),#000 calc(100% - 22% * var(--psf)),rgba(0,0,0,.8) calc(100% - 15% * var(--psf)),rgba(0,0,0,.45) calc(100% - 9% * var(--psf)),rgba(0,0,0,.12) calc(100% - 4% * var(--psf)),transparent 100%),linear-gradient(to bottom,transparent 0,rgba(0,0,0,.12) calc(3% * var(--psf)),rgba(0,0,0,.45) calc(7% * var(--psf)),rgba(0,0,0,.8) calc(12% * var(--psf)),#000 calc(18% * var(--psf)),#000 calc(100% - 18% * var(--psf)),rgba(0,0,0,.8) calc(100% - 12% * var(--psf)),rgba(0,0,0,.45) calc(100% - 7% * var(--psf)),rgba(0,0,0,.12) calc(100% - 3% * var(--psf)),transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.12) calc(4% * var(--psf)),rgba(0,0,0,.45) calc(9% * var(--psf)),rgba(0,0,0,.8) calc(15% * var(--psf)),#000 calc(22% * var(--psf)),#000 calc(100% - 22% * var(--psf)),rgba(0,0,0,.8) calc(100% - 15% * var(--psf)),rgba(0,0,0,.45) calc(100% - 9% * var(--psf)),rgba(0,0,0,.12) calc(100% - 4% * var(--psf)),transparent 100%),linear-gradient(to bottom,transparent 0,rgba(0,0,0,.12) calc(3% * var(--psf)),rgba(0,0,0,.45) calc(7% * var(--psf)),rgba(0,0,0,.8) calc(12% * var(--psf)),#000 calc(18% * var(--psf)),#000 calc(100% - 18% * var(--psf)),rgba(0,0,0,.8) calc(100% - 12% * var(--psf)),rgba(0,0,0,.45) calc(100% - 7% * var(--psf)),rgba(0,0,0,.12) calc(100% - 3% * var(--psf)),transparent 100%);mask-composite:intersect}
{display:block;width:100%;height:100%;object-fit:cover}
  .ps-flapbox{perspective:900px;z-index:5}
  .ps-flap{position:absolute;left:0;top:0;width:100%;height:62%;transform-origin:50% 0;transform-style:preserve-3d;clip-path:polygon(0 0,100% 0,50% 100%)}
  .ps-flap i{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .ps-flap .ps-fr{background:linear-gradient(170deg,#fdffff,#e3f1f5 60%,#d3e8ee)}
  .ps-flap .ps-bk{background:linear-gradient(170deg,#b9dce6,#a6d0dd);transform:rotateX(180deg)}
  
  .ps-clip{opacity:0}
  .photo-scene.play .ps-env{animation:psIn .6s ease-out forwards}
  .photo-scene.play .ps-clip{animation:psIn .05s 1.05s linear forwards}
  .photo-scene.play .ps-flapbox{animation:psIn .6s ease-out forwards,psFlapZ .8s .4s step-end both}
  .photo-scene.play .ps-flap{animation:psFlapOpen .8s .4s cubic-bezier(.5,0,.3,1) both}
  .photo-scene.play .ps-wrap{animation:psPhotoUp 1.7s 1.1s cubic-bezier(.3,.65,.3,1) both}
  .photo-scene.play .ps-soft{animation:psSoftIn 2.2s 2.4s ease-in-out both}
  .photo-scene.play .ps-hard{animation:psHardOut 2.8s 2.4s ease-in-out both}
  @keyframes psIn{to{opacity:1;transform:none}}
  @keyframes psFlapOpen{from{transform:rotateX(0)}to{transform:rotateX(180deg)}}
  @keyframes psFlapZ{0%{z-index:5}50%{z-index:1}100%{z-index:1}}
  @keyframes psPhotoUp{
   0%{transform:translateY(calc(var(--PW) * .9)) rotate(0)}
   65%{transform:translateY(0) rotate(-2deg)}
   100%{transform:translateY(0) rotate(-5deg)}}
  @keyframes psSoftIn{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
  @keyframes psHardOut{0%{opacity:1}35%{opacity:1}100%{opacity:0}}
  
  .photo-scene{ margin-top:18px; margin-bottom:24px; }

  .scroll-cue{
    margin-top:20px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:var(--ink-soft);
  }
  .scroll-cue svg{ width:18px; height:18px; stroke:var(--deep-sea); animation:bob 2s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(6px);} }

  /* --- DIVIDER (signature seal, reused small) --- */
  .divider{
    height:1px;
    width:90px;
    margin:0 auto 28px;
    background:linear-gradient(90deg, transparent, var(--tiffany-mid), transparent);
  }

  /* --- INFO SECTION --- */
  .info-card{
    background:linear-gradient(165deg, #ffffff 0%, var(--tiffany-pale) 100%);
    border-radius:16px;
    padding:44px 32px;
    box-shadow:var(--shadow);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .info-card::before{
    content:'';
    position:absolute;
    top:0; left:-60%;
    width:35%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,0.6), transparent);
    transform:skewX(-20deg);
    opacity:0;
    pointer-events:none;
  }
  .info-card.in-view::before{
    animation:sheen 5s ease-in-out .35s 2;
  }
  @keyframes sheen{
    0%{ left:-60%; opacity:0; }
    20%{ opacity:1; }
    100%{ left:130%; opacity:0; }
  }
  .info-title{ font-size:24px; margin-bottom:8px; }
  .venue-name{
    font-size:17px;
    color:var(--ink-soft);
    margin-bottom:28px;
    line-height:1.8;
  }

  .timeline{
    display:flex;
    flex-direction:column;
    gap:0;
    max-width:280px;
    margin:0 auto 30px;
    text-align:left;
  }
  .timeline-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 0;
    position:relative;
  }
  .timeline-row:not(:last-child)::after{
    content:'';
    position:absolute;
    left:19px; top:32px; bottom:-4px;
    width:1px;
    background:var(--tiffany-mid);
  }
  .icon-slot{
    width:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .timeline-icon{
    width:20px; height:20px;
    color:var(--deep-sea);
  }
  .timeline-icon-wide{
    width:38px; height:18px;
  }
  .timeline-icon path{
    stroke-dasharray:320;
    stroke-dashoffset:320;
  }
  .info-card.in-view .timeline-row:nth-child(1) .timeline-icon path{
    animation:drawLine 2.4s ease .5s forwards;
  }
  .info-card.in-view .timeline-row:nth-child(2) .timeline-icon path{
    animation:drawLine 2.4s ease 1.2s forwards;
  }
  @keyframes drawLine{
    to{ stroke-dashoffset:0; }
  }
  .timeline-time{
    font-family:'Cormorant Garamond', serif;
    font-size:19px;
    color:var(--deep-sea-2);
    min-width:66px;
  }
  .timeline-label{ font-size:15.5px; color:var(--ink); padding-top:2px; font-family:'Klee One','Noto Sans TC', sans-serif; }

  .map-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:13px 30px;
    border-radius:999px;
    border:none;
    background:var(--deep-sea);
    color:#fff;
    font-size:14px;
    letter-spacing:1.5px;
    text-decoration:none;
    transition:background .3s ease, transform .3s ease;
  }
  .map-btn:hover{ background:var(--deep-sea-2); transform:translateY(-2px); }
  .map-btn svg{ width:16px; height:16px; stroke:#fff; }

  /* --- RSVP SECTION --- */
  .rsvp-placeholder{
    border:1px dashed var(--tiffany-mid);
    border-radius:14px;
    padding:56px 24px;
    text-align:center;
    color:var(--ink-soft);
    background:linear-gradient(160deg, rgba(191,234,228,0.35), rgba(255,255,255,0.4));
  }
  .rsvp-pulse-wrap{
    position:relative;
    padding:18px;
    border:1px dashed var(--tiffany-mid);
    border-radius:10px;
    animation:rsvpPulse 3.2s ease-in-out infinite;
  }
  @keyframes rsvpPulse{
    0%,100%{ box-shadow:0 0 0 rgba(127,209,199,0); }
    50%{ box-shadow:0 0 45px rgba(127,209,199,0.55); }
  }
  .rsvp-placeholder svg{ width:30px; height:30px; stroke:var(--tiffany-mid); margin-bottom:12px; }
  .rsvp-placeholder p{ margin:4px 0; font-size:13.5px; letter-spacing:1px; }
  /* NOTE for designer: paste the RSVP embed code inside #rsvp-embed-container */

  /* --- FOOTER --- */
  footer{
    position:relative;
    text-align:center;
    padding:70px 24px 90px;
    overflow:hidden;
    background:linear-gradient(180deg, transparent 0%, rgba(174,217,234,0.4) 100%);
  }
  footer p{
    position:relative;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    letter-spacing:2px;
    color:var(--ink-soft);
    font-size:15px;
    font-weight:700;
  }

  @media (min-width:768px){
    section{ padding:130px 24px; }
    .info-card{ padding:56px 60px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>

<!-- ===================== MAIN CONTENT ===================== -->
<div id="main-content">

  <section id="hero">
    <p class="eyebrow reveal">Save the Date</p>
    <h1 class="couple-names reveal">致維<span class="amp script">&amp;</span>敬芸</h1>

    <!-- NOTE for designer: 換照片只要替換下面 img 的 src（建議 960px 寬的 jpg，約 150KB） -->
    <div class="photo-scene" id="photoScene">

<script>
(function(){
  var envelope = document.getElementById('envelope');
  var envelopeScreen = document.getElementById('envelope-screen');
  var mainContent = document.getElementById('main-content');
  var musicToggle = document.getElementById('music-toggle');
  var bgm = document.getElementById('bgm');
  var isPlaying = false;

  // ---- 開啟後的場景：海浪 + 玻璃泡泡 + 堆疊愛心 + 柔焦光斑 ----
  var SVG_NS = 'http://www.w3.org/2000/svg';
  function rnd(a,b){ return a + Math.random()*(b-a); }

  function wavePath(base, amp, lambda, phase){
    var d = '', x;
    for(x=0; x<=200.001; x+=1){
      var th = 2*Math.PI*x/lambda + phase;
      var y = base - amp*(Math.sin(th) + 0.3*Math.sin(2*th+0.9));
      d += (x===0?'M':'L') + x.toFixed(1) + ',' + y.toFixed(2) + ' ';
    }
    return d;
  }
  function buildSea(){
    var host = document.getElementById('burstSea');
    if(!host) return;
    var layers = [
      {cls:'sea-back',  c1:'#b9e0ee', c2:'#8cc9de', lambda:50,     amp:3.2, base:12, phase:0.4, foam:false},
      {cls:'sea-mid',   c1:'#9adcd2', c2:'#6fc6bd', lambda:100/3,  amp:2.6, base:12, phase:1.6, foam:false},
      {cls:'sea-front', c1:'#dff6f6', c2:'#a9e3e3', lambda:25,     amp:2.2, base:12, phase:2.8, foam:true}
    ];
    layers.forEach(function(L, i){
      var wrap = document.createElement('div');
      wrap.className = 'sea-wave ' + L.cls;
      var svg = document.createElementNS(SVG_NS,'svg');
      svg.setAttribute('viewBox','0 0 200 60');
      svg.setAttribute('preserveAspectRatio','none');
      var gid = 'seaGrad' + i;
      var defs = document.createElementNS(SVG_NS,'defs');
      var g = document.createElementNS(SVG_NS,'linearGradient');
      g.setAttribute('id', gid); g.setAttribute('x1','0'); g.setAttribute('y1','0'); g.setAttribute('x2','0'); g.setAttribute('y2','1');
      [[0,L.c1,.92],[1,L.c2,.95]].forEach(function(st){
        var e = document.createElementNS(SVG_NS,'stop');
        e.setAttribute('offset', st[0]); e.setAttribute('stop-color', st[1]); e.setAttribute('stop-opacity', st[2]);
        g.appendChild(e);
      });
      defs.appendChild(g); svg.appendChild(defs);
      var line = wavePath(L.base, L.amp, L.lambda, L.phase);
      var fill = document.createElementNS(SVG_NS,'path');
      fill.setAttribute('class','fill');
      fill.setAttribute('d', line + 'L200,60 L0,60 Z');
      fill.setAttribute('fill','url(#'+gid+')');
      svg.appendChild(fill);
      var crest2 = document.createElementNS(SVG_NS,'path');
      crest2.setAttribute('class','crest2');
      crest2.setAttribute('d', wavePath(L.base+3.2, L.amp*0.9, L.lambda, L.phase+0.5));
      svg.appendChild(crest2);
      var crest = document.createElementNS(SVG_NS,'path');
      crest.setAttribute('class','crest');
      crest.setAttribute('d', line);
      svg.appendChild(crest);
      if(L.foam){
        var foam = document.createElementNS(SVG_NS,'path');
        foam.setAttribute('class','foam');
        foam.setAttribute('d', wavePath(L.base+1.4, L.amp, L.lambda, L.phase));
        svg.appendChild(foam);
      }
      wrap.appendChild(svg);
      host.appendChild(wrap);
    });
  }

  function buildBokeh(){
    var host = document.getElementById('burstBokeh');
    if(!host) return;
    var colors = ['rgba(255,255,255,.9)','rgba(174,217,234,.9)','rgba(127,209,199,.7)'];
    var n = 8;
    for(var i=0;i<n;i++){
      var b = document.createElement('span');
      b.className = 'bokeh';
      b.style.setProperty('--left', ((i + rnd(.15,.85)) / n * 100).toFixed(1) + '%');
      b.style.setProperty('--top', rnd(30,85).toFixed(0) + '%');
      b.style.setProperty('--size', rnd(70,150).toFixed(0) + 'px');
      b.style.setProperty('--bk-color', colors[i % colors.length]);
      b.style.setProperty('--bk-peak', rnd(.35,.65).toFixed(2));
      b.style.setProperty('--delay', rnd(0,.35).toFixed(2) + 's');
      host.appendChild(b);
    }
  }

  function buildRisers(bubbleCount, heartCount){
    var host = document.getElementById('burstBubbles');
    if(!host) return;
    var H = window.innerHeight, W = window.innerWidth;
    var small = W < 600;
    var total = bubbleCount + heartCount;
    // 把「泡泡」和「愛心」的種類洗牌後，平均分配到整個寬度（分層取樣，避免擠成一團）
    var kinds = [], i;
    for(i=0;i<bubbleCount;i++) kinds.push('b');
    for(i=0;i<heartCount;i++) kinds.push('h');
    for(i=kinds.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=kinds[i]; kinds[i]=kinds[j]; kinds[j]=t; }
    var frag = document.createDocumentFragment();
    kinds.forEach(function(k, idx){
      var left = ((idx + rnd(.15,.85)) / total * 100).toFixed(1) + '%';
      var delay = rnd(0,.3).toFixed(2) + 's';
      var dur = rnd(1.05,1.2).toFixed(2) + 's';
      var rise = Math.round(H * rnd(.45,.78)) + 'px';
      var sway = Math.round(rnd(-28,28)) + 'px';
      var start = rnd(2,16).toFixed(1) + '%';
      if(k === 'b'){
        var b = document.createElement('span');
        b.className = 'bubble';
        var bs = small ? rnd(26,56) : rnd(34,72);
        b.style.setProperty('--size', bs.toFixed(0) + 'px');
        b.style.setProperty('--left', left);
        b.style.setProperty('--start', start);
        b.style.setProperty('--delay', delay);
        b.style.setProperty('--dur', dur);
        b.style.setProperty('--rise-y', rise);
        b.style.setProperty('--sway', sway);
        frag.appendChild(b);
      }else{
        var svg = document.createElementNS(SVG_NS,'svg');
        svg.setAttribute('viewBox','0 0 24 24');
        svg.setAttribute('class','floating-heart');
        var hs = small ? rnd(34,60) : rnd(44,80);
        svg.style.setProperty('--size', hs.toFixed(0) + 'px');
        svg.style.setProperty('--left', left);
        svg.style.setProperty('--start', start);
        svg.style.setProperty('--delay', delay);
        svg.style.setProperty('--dur', dur);
        svg.style.setProperty('--rise-y', rise);
        svg.style.setProperty('--sway', sway);
        ['layer3','layer2','layer1'].forEach(function(cls){
          var use = document.createElementNS(SVG_NS,'use');
          use.setAttribute('href','#stack-heart');
          use.setAttribute('class','layer ' + cls);
          svg.appendChild(use);
        });
        frag.appendChild(svg);
      }
    });
    host.appendChild(frag);
  }

  function buildBurst(){
    buildSea();
    buildBokeh();
    var small = window.innerWidth < 600;
    buildRisers(small ? 12 : 16, small ? 8 : 10);
  }
  buildBurst();

  // Open the flap, release hearts & bubbles, then transition into the invitation
  function openEnvelope(){
    if(envelope.classList.contains('open')) return;
    envelope.style.setProperty('--p', 1);
    envelope.classList.add('open');
    envelopeScreen.classList.add('burst');
    setTimeout(function(){
      envelopeScreen.classList.add('hidden');
      mainContent.classList.add('visible');
      document.body.style.overflow = 'auto';
      tryPlayMusic();
      setTimeout(armPhoto, 500);
      setTimeout(function(){ envelopeScreen.style.display = 'none'; }, 700);
    }, 1500);
  }

  // Swipe up (or drag with mouse): the flap follows the finger.
  // Past 50% it completes on its own; a plain tap/click also opens it.
  var DRAG_RANGE = 150;
  var dragging = false, moved = false, dragStartY = 0, progress = 0;

  envelopeScreen.addEventListener('pointerdown', function(e){
    if(envelope.classList.contains('open')) return;
    dragging = true; moved = false; progress = 0;
    dragStartY = e.clientY;
    envelope.classList.add('dragging');
    envelopeScreen.classList.add('grabbing');
    if(envelopeScreen.setPointerCapture){
      try{ envelopeScreen.setPointerCapture(e.pointerId); }catch(err){}
    }
  });
  envelopeScreen.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dy = dragStartY - e.clientY;
    if(Math.abs(dy) > 6) moved = true;
    progress = Math.max(0, Math.min(1, dy / DRAG_RANGE));
    envelope.style.setProperty('--p', progress);
  });
  function finishDrag(cancelled){
    if(!dragging) return;
    dragging = false;
    envelope.classList.remove('dragging');
    envelopeScreen.classList.remove('grabbing');
    if(!cancelled && (!moved || progress >= 0.5)){
      openEnvelope();
    } else {
      progress = 0;
      envelope.style.setProperty('--p', 0);
    }
  }
  envelopeScreen.addEventListener('pointerup', function(){ finishDrag(false); });
  envelopeScreen.addEventListener('pointercancel', function(){ finishDrag(true); });

  // Desktop: scrolling down also opens it; keyboard: Enter / Space
  envelopeScreen.addEventListener('wheel', function(e){
    if(e.deltaY > 20) openEnvelope();
  }, { passive:true });
  envelope.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openEnvelope(); }
  });

  document.body.style.overflow = 'hidden';

  // Music toggle
  function tryPlayMusic(){
    var p = bgm.play();
    if(p && p.catch){
      p.then(function(){
        isPlaying = true;
        musicToggle.classList.remove('muted');
      }).catch(function(){
        // autoplay blocked by browser; wait for user gesture on the toggle itself
        isPlaying = false;
        musicToggle.classList.add('muted');
      });
    }
  }

  musicToggle.addEventListener('click', function(){
    if(isPlaying){
      bgm.pause();
      isPlaying = false;
      musicToggle.classList.add('muted');
    } else {
      bgm.play().then(function(){
        isPlaying = true;
        musicToggle.classList.remove('muted');
      }).catch(function(){});
    }
  });

  // Hero photo: envelope opens and photo slides out. Armed only after the cover
  // envelope has faded away, so the effect is actually seen; tap to replay.
  var photoScene = document.getElementById('photoScene');
  (function(){ var h=document.querySelector('.ps-hard'), c=document.querySelector('.ps-soft img'); if(h&&c) c.src=h.src; })();
  function playPhoto(){
    if(!photoScene) return;
    photoScene.classList.remove('play');
    void photoScene.offsetWidth;
    photoScene.classList.add('play');
  }
  function armPhoto(){
    if(!photoScene) return;
    new IntersectionObserver(function(es, o){
      es.forEach(function(en){ if(en.isIntersecting){ playPhoto(); o.disconnect(); } });
    }, { threshold: .4 }).observe(photoScene);
  }
  if(photoScene) photoScene.addEventListener('click', playPhoto);

  // Scroll reveal
  var reveals = document.querySelectorAll('.reveal');
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  reveals.forEach(function(el){ io.observe(el); });
})();
</script>

</body>
</html>
