<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Wedding Invitation ｜ 電子喜帖</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400&family=Klee+One:wght@400;600&display=swap');

  :root{
    --silver-1:#f5f6f7;
    --silver-2:#e4e7e9;
    --silver-shine:#ffffff;
    --tiffany-pale:#eaf8f6;
    --tiffany-soft:#bfeae4;
    --tiffany-mid:#7fd1c7;
    --tiffany-deep:#1f6e68;
    --tiffany-deep-2:#154e4a;
    --ink:#33403f;
    --ink-soft:#6b7876;
    --paper:#fdfefe;
    --shadow: 0 20px 60px rgba(31,110,104,0.12);
    --sky-blue:#c3dbe9;
    --sky-blue-deep:#93bfd6;
    --cream:#f8f0e0;
    --cream-deep:#efe0bd;
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    font-family:'Noto Sans TC','Cormorant Garamond',serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 900px 500px at 15% 8%, rgba(127,209,199,0.35), transparent 60%),
      radial-gradient(ellipse 800px 600px at 85% 38%, rgba(191,234,228,0.55), transparent 65%),
      radial-gradient(ellipse 900px 700px at 20% 68%, rgba(127,209,199,0.3), transparent 60%),
      radial-gradient(ellipse 800px 600px at 90% 95%, rgba(191,234,228,0.5), transparent 65%),
      linear-gradient(180deg, var(--tiffany-pale) 0%, var(--paper) 30%, var(--tiffany-pale) 55%, var(--paper) 78%, var(--tiffany-pale) 100%);
    overflow-x:hidden;
  }

  h1,h2,h3{ font-weight:400; margin:0; }

  .script{ font-family:'Parisienne', cursive; }
  .serif-tc{ font-family:'Noto Serif TC', serif; font-weight:300; }
  .cute-tc{ font-family:'Klee One','Noto Sans TC', sans-serif; }

  button{ font-family:inherit; cursor:pointer; }

  /* ===================== ENVELOPE SCREEN ===================== */
  #envelope-screen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 800px 600px at 15% 12%, var(--sky-blue-deep), transparent 62%),
      radial-gradient(ellipse 900px 700px at 88% 90%, var(--cream-deep), transparent 65%),
      radial-gradient(ellipse 700px 600px at 90% 10%, var(--tiffany-soft), transparent 60%),
      linear-gradient(150deg, var(--cream) 0%, var(--sky-blue) 55%, var(--tiffany-soft) 100%);
    z-index:100;
    transition:opacity 1s ease, visibility 1s ease;
  }
  #envelope-screen.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }

  .envelope-stage{
    perspective:1600px;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    animation:stageIn 1.4s ease forwards;
  }
  @keyframes stageIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .envelope{
    position:relative;
    width:clamp(320px, 92vw, 620px);
    height:clamp(220px, 63vw, 420px);
  }

  .envelope-body{
    position:absolute; inset:0;
    background:linear-gradient(155deg, var(--silver-shine) 0%, var(--silver-1) 45%, var(--silver-2) 100%);
    border-radius:8px;
    box-shadow:
      var(--shadow),
      inset 0 0 0 1px rgba(31,110,104,0.16),
      inset 0 1px 0 rgba(255,255,255,0.8);
    overflow:hidden;
  }
  .envelope-body::before{
    /* subtle inner envelope seam lines + soft paper grain */
    content:'';
    position:absolute; inset:0;
    background:
      linear-gradient(135deg, transparent 48%, rgba(31,110,104,0.06) 50%, transparent 52%),
      linear-gradient(45deg, transparent 48%, rgba(31,110,104,0.06) 50%, transparent 52%),
      repeating-linear-gradient(115deg, rgba(31,110,104,0.015) 0px, transparent 2px, transparent 4px);
  }

  .envelope-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:62%;
    transform-origin:top center;
    transform-style:preserve-3d;
    transition:transform 1.5s cubic-bezier(.65,0,.35,1);
    z-index:3;
    filter:drop-shadow(0 2px 10px rgba(31,110,104,0.1));
  }
  .envelope-flap svg{ display:block; width:100%; height:100%; overflow:visible; }
  .envelope.open .envelope-flap{
    transform:rotateX(180deg);
  }

  .envelope-text{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    z-index:6;
    text-align:center;
    pointer-events:none;
    transition:opacity .6s ease;
  }
  .envelope-text .script{
    font-size:clamp(26px, 6vw, 38px);
    color:var(--tiffany-deep-2);
    display:block;
    animation:breathe 3.2s ease-in-out infinite;
  }
  .envelope-text .tap-hint{
    display:block;
    margin-top:8px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:13px;
    letter-spacing:3px;
    color:var(--ink-soft);
  }
  .envelope.open .envelope-text{ opacity:0; }
  @keyframes breathe{
    0%,100%{ transform:scale(1); opacity:.82; }
    50%{ transform:scale(1.045); opacity:1; }
  }

  /* ===================== MUSIC TOGGLE ===================== */
  #music-toggle{
    position:fixed;
    top:20px; right:20px;
    width:42px; height:42px;
    border-radius:50%;
    border:1px solid rgba(31,110,104,0.25);
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    z-index:200;
    transition:background .3s ease;
  }
  #music-toggle:hover{ background:rgba(255,255,255,0.95); }
  #music-toggle svg{ width:20px; height:20px; stroke:var(--tiffany-deep-2); }
  .mute-slash{ display:none; }
  #music-toggle.muted .mute-slash{ display:block; }
  #music-toggle.muted .wave{ opacity:.25; }

  /* ===================== MAIN CONTENT ===================== */
  #main-content{
    opacity:0;
    transition:opacity 1.2s ease;
  }
  #main-content.visible{ opacity:1; }

  section{
    max-width:720px;
    margin:0 auto;
    padding:96px 24px;
    position:relative;
  }

  .reveal{
    opacity:0;
    transform:translateY(28px);
    transition:opacity .9s ease, transform .9s ease;
  }
  .reveal.in-view{
    opacity:1;
    transform:translateY(0);
  }

  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:15px;
    letter-spacing:4px;
    color:var(--tiffany-deep);
    text-transform:uppercase;
    text-align:center;
    margin-bottom:14px;
  }

  /* --- HERO / PHOTO --- */
  #hero{ text-align:center; padding-top:64px; }

  .couple-names{
    font-size:clamp(34px, 8vw, 54px);
    color:var(--ink);
  }
  .couple-names .amp{
    color:var(--tiffany-deep);
    margin:0 12px;
  }

  .photo-frame{
    margin:48px auto 0;
    width:100%;
    max-width:460px;
    aspect-ratio:4/5;
    border-radius:10px;
    border:1px dashed var(--tiffany-mid);
    background:linear-gradient(160deg, var(--tiffany-pale), #ffffff 60%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--ink-soft);
    position:relative;
    overflow:hidden;
  }
  .photo-frame::before{
    /* thin corner ornament, reuses the line-icon language */
    content:'';
    position:absolute;
    top:14px; left:14px; right:14px; bottom:14px;
    border:1px solid rgba(31,110,104,0.18);
    border-radius:4px;
    pointer-events:none;
  }
  .photo-frame svg{ width:36px; height:36px; stroke:var(--tiffany-mid); opacity:.8; }
  .photo-frame span{ font-size:13px; letter-spacing:2px; font-family:'Cormorant Garamond', serif; }
  /* NOTE for designer: replace this whole .photo-frame block's background
     with <img src="your-photo.jpg"> once photos are supplied. */

  .scroll-cue{
    margin-top:56px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:var(--ink-soft);
  }
  .scroll-cue svg{ width:18px; height:18px; stroke:var(--tiffany-deep); animation:bob 2s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(6px);} }

  /* --- DIVIDER (signature seal, reused small) --- */
  .divider{
    height:1px;
    width:90px;
    margin:0 auto 28px;
    background:linear-gradient(90deg, transparent, var(--tiffany-mid), transparent);
  }

  /* --- INFO SECTION --- */
  .info-card{
    background:linear-gradient(165deg, #ffffff 0%, var(--tiffany-pale) 100%);
    border-radius:16px;
    padding:44px 32px;
    box-shadow:var(--shadow);
    text-align:center;
  }
  .info-title{ font-size:22px; margin-bottom:6px; }
  .venue-name{
    font-size:15px;
    color:var(--ink-soft);
    margin-bottom:28px;
    line-height:1.8;
  }

  .timeline{
    display:flex;
    flex-direction:column;
    gap:0;
    max-width:280px;
    margin:0 auto 30px;
    text-align:left;
  }
  .timeline-row{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:10px 0;
    position:relative;
  }
  .timeline-row:not(:last-child)::after{
    content:'';
    position:absolute;
    left:9px; top:30px; bottom:-4px;
    width:1px;
    background:var(--tiffany-mid);
  }
  .timeline-icon{
    width:20px; height:20px;
    color:var(--tiffany-deep);
    margin-top:1px;
    flex-shrink:0;
  }
  .timeline-time{
    font-family:'Cormorant Garamond', serif;
    font-size:17px;
    color:var(--tiffany-deep-2);
    min-width:64px;
  }
  .timeline-label{ font-size:14px; color:var(--ink); padding-top:1px; }

  .map-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:13px 30px;
    border-radius:999px;
    border:none;
    background:var(--tiffany-deep);
    color:#fff;
    font-size:14px;
    letter-spacing:1.5px;
    text-decoration:none;
    transition:background .3s ease, transform .3s ease;
  }
  .map-btn:hover{ background:var(--tiffany-deep-2); transform:translateY(-2px); }
  .map-btn svg{ width:16px; height:16px; stroke:#fff; }

  /* --- RSVP SECTION --- */
  .rsvp-placeholder{
    border:1px dashed var(--tiffany-mid);
    border-radius:14px;
    padding:56px 24px;
    text-align:center;
    color:var(--ink-soft);
    background:linear-gradient(160deg, rgba(191,234,228,0.35), rgba(255,255,255,0.4));
  }
  .rsvp-placeholder svg{ width:30px; height:30px; stroke:var(--tiffany-mid); margin-bottom:12px; }
  .rsvp-placeholder p{ margin:4px 0; font-size:13.5px; letter-spacing:1px; }
  /* NOTE for designer: paste the RSVP embed code inside #rsvp-embed-container */

  /* --- FOOTER --- */
  footer{
    position:relative;
    text-align:center;
    padding:70px 24px 60px;
    overflow:hidden;
  }
  footer p{
    position:relative;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    letter-spacing:2px;
    color:var(--ink-soft);
    font-size:14px;
  }

  @media (min-width:768px){
    section{ padding:130px 24px; }
    .info-card{ padding:56px 60px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

<!-- ===================== ENVELOPE SCREEN ===================== -->
<div id="envelope-screen">
  <div class="envelope-stage">
    <div class="envelope" id="envelope">
      <div class="envelope-body"></div>
      <div class="envelope-text">
        <span class="script">Wedding Invitation</span>
        <span class="tap-hint">tap to open</span>
      </div>
      <div class="envelope-flap">
        <svg viewBox="0 0 100 62" preserveAspectRatio="none">
          <defs>
            <linearGradient id="flapGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="55%" stop-color="#f0f1f2"/>
              <stop offset="100%" stop-color="#e2e5e7"/>
            </linearGradient>
          </defs>
          <path d="M0,0 L100,0 C92,26 70,46 50,60 C30,46 8,26 0,0 Z"
                fill="url(#flapGrad)" stroke="#7fd1c7" stroke-width="0.5"/>
        </svg>
      </div>
    </div>
  </div>
</div>

<!-- ===================== MUSIC TOGGLE ===================== -->
<button id="music-toggle" aria-label="背景音樂開關">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 6 L9 16 A2.4 2.4 0 1 1 7.2 13.8" />
    <path d="M9 6 L18 4 L18 14 A2.4 2.4 0 1 1 16.2 11.8" />
    <path class="wave" d="M20.5 3.5 a8 8 0 0 1 0 11" />
    <line class="mute-slash" x1="2" y1="2" x2="22" y2="22" />
  </svg>
</button>
<audio id="bgm" loop preload="none">
  <source src="bgm.mp3" type="audio/mpeg">
  <!-- NOTE for designer: replace bgm.mp3 with your chosen background music file -->
</audio>

<!-- ===================== MAIN CONTENT ===================== -->
<div id="main-content">

  <section id="hero">
    <p class="eyebrow reveal">Save the Date</p>
    <h1 class="couple-names script reveal">Groom<span class="amp">&amp;</span>Bride</h1>

    <div class="photo-frame reveal">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="1.5"/>
        <circle cx="8.5" cy="10" r="1.6"/>
        <path d="M3 16 L9 11 L13 14 L16 11.5 L21 16"/>
      </svg>
      <span>婚紗照預留版位 · Photo Coming Soon</span>
    </div>

    <div class="scroll-cue reveal">
      <span style="font-size:12px;letter-spacing:3px;">SCROLL</span>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9 L12 15 L18 9"/>
      </svg>
    </div>
  </section>

  <section id="info">
    <div class="divider reveal"></div>
    <p class="eyebrow reveal">Wedding Information</p>

    <div class="info-card reveal">
      <h2 class="info-title cute-tc">尚順君樂飯店 4F 星輝廳</h2>
      <p class="venue-name cute-tc">2027年6月12日(六)</p>

      <div class="timeline">
        <div class="timeline-row">
          <svg class="timeline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 11V6a2 2 0 1 1 4 0v5M15 11V6a2 2 0 1 1 4 0v5"/>
            <path d="M4 11h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-3z"/>
          </svg>
          <span class="timeline-time">12:00</span>
          <span class="timeline-label">賓客入席</span>
        </div>
        <div class="timeline-row">
          <svg class="timeline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h5l-1 7a3.4 3.4 0 0 1-3 3.4"/>
            <path d="M18 3h-5l1 7a3.4 3.4 0 0 0 3 3.4"/>
            <path d="M7 13.4V21M17 13.4V21M4 21h6M14 21h6"/>
          </svg>
          <span class="timeline-time">12:30</span>
          <span class="timeline-label">婚宴開席</span>
        </div>
      </div>

      <a class="map-btn" href="https://maps.app.goo.gl/UK2PMzypW8uQGkNV8" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21s-7-6.5-7-11.5A7 7 0 0 1 19 9.5C19 14.5 12 21 12 21z"/>
          <circle cx="12" cy="9.5" r="2.4"/>
        </svg>
        開啟 Google Map 導航
      </a>
    </div>
  </section>

  <section id="rsvp">
    <div class="divider reveal"></div>
    <p class="eyebrow reveal">出席調查</p>

    <div class="rsvp-placeholder reveal" id="rsvp-embed-container">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16v16H4z"/>
        <path d="M8 9h8M8 13h5"/>
      </svg>
      <p>出席調查表預留區</p>
      <p>調查表嵌入碼將顯示於此</p>
      <!-- NOTE for designer: paste the survey's HTML embed code inside this container,
           replacing this placeholder block. -->
    </div>
  </section>

  <footer>
    
    <p>With love, we invite you to celebrate with us</p>
  </footer>

</div>

<script>
(function(){
  var envelope = document.getElementById('envelope');
  var envelopeScreen = document.getElementById('envelope-screen');
  var mainContent = document.getElementById('main-content');
  var musicToggle = document.getElementById('music-toggle');
  var bgm = document.getElementById('bgm');
  var isPlaying = false;

  // Tap envelope: open the flap, then transition straight into the invitation
  envelope.addEventListener('click', function(){
    if(envelope.classList.contains('open')) return;
    envelope.classList.add('open');
    setTimeout(function(){
      envelopeScreen.classList.add('hidden');
      mainContent.classList.add('visible');
      document.body.style.overflow = 'auto';
      tryPlayMusic();
      setTimeout(function(){ envelopeScreen.style.display = 'none'; }, 1100);
    }, 1300);
  });

  document.body.style.overflow = 'hidden';

  // Music toggle
  function tryPlayMusic(){
    var p = bgm.play();
    if(p && p.catch){
      p.then(function(){
        isPlaying = true;
        musicToggle.classList.remove('muted');
      }).catch(function(){
        // autoplay blocked by browser; wait for user gesture on the toggle itself
        isPlaying = false;
        musicToggle.classList.add('muted');
      });
    }
  }

  musicToggle.addEventListener('click', function(){
    if(isPlaying){
      bgm.pause();
      isPlaying = false;
      musicToggle.classList.add('muted');
    } else {
      bgm.play().then(function(){
        isPlaying = true;
        musicToggle.classList.remove('muted');
      }).catch(function(){});
    }
  });

  // Scroll reveal
  var reveals = document.querySelectorAll('.reveal');
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  reveals.forEach(function(el){ io.observe(el); });
})();
</script>

</body>
</html>
